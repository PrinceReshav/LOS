syntax = "proto3";

package employee;

option java_multiple_files = true;
option java_package = "com.los.grpc.employee";
option java_outer_classname = "EmployeeProto";

message EmployeeRequest {
  string employeeId = 1;
}

message EmployeeResponse {

  string employeeId = 1;
  string userId = 2;

  string fullName = 3;
  string email = 4;
  string mobile = 5;

  // The employee's ORGANIZATIONAL/hierarchy role (e.g. FIELD_OFFICER,
  // RELATIONSHIP_MANAGER, CEO - owned by los-admin-service's role
  // catalog). This is NOT administration-service's system-access role
  // (ADMIN/SALES) - those are two different concepts and must never be
  // conflated. See CreateEmployeeRequest for why this distinction matters.
  string orgRoleId = 6;
  string orgRoleName = 7;

  string profileId = 8;
  string profileName = 9;

  bool active = 10;

  // Active branch assignment for this employee (from
  // EmployeeBranchMapping in los-admin-service) - empty string if the
  // employee has no active branch mapping. Added for record-level
  // visibility (branch-scoped access) in administration-service; not
  // used by employee creation/status flows.
  string branchId = 11;
}

message CreateEmployeeRequest {

  string employeeId = 1;
  string userId = 2;

  string fullName = 3;
  string email = 4;
  string mobile = 5;

  // FIX: this used to be populated from administration-service's own
  // system-access role (role_admin / role_sales), which does not exist
  // in los-admin-service's role catalog. That mismatch is exactly what
  // caused "Role not found: role_sales" / "Role not found: role_admin"
  // when assigning a branch or reporting manager, since
  // EmployeeHierarchyValidator looks up employee.roleId against
  // los-admin-service's OWN role table (FIELD_OFFICER, CEO, ...).
  //
  // orgRoleId/orgRoleName must be a valid roleId/roleName from
  // los-admin-service's /admin/roles catalog - administration-service
  // is responsible for resolving and validating this BEFORE calling
  // createEmployee (see OrgRoleClient in administration-service).
  string orgRoleId = 6;
  string orgRoleName = 7;

  string profileId = 8;
  string profileName = 9;
}

message CreateEmployeeResponse {

  string employeeId = 1;
  bool success = 2;
}

message UpdateEmployeeStatusRequest {

  string employeeId = 1;
  bool active = 2;
}

message UpdateEmployeeStatusResponse {

  string employeeId = 1;
  bool active = 2;
}

service EmployeeService {

  rpc GetEmployeeById(EmployeeRequest)
      returns (EmployeeResponse);

  rpc CreateEmployee(CreateEmployeeRequest)
      returns (CreateEmployeeResponse);

  rpc UpdateEmployeeStatus(UpdateEmployeeStatusRequest)
      returns (UpdateEmployeeStatusResponse);
}