server:
  port: 8085

spring:

  application:
    name: api-gateway

  cloud:

    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true

        cors-configurations:

          '[/**]':

            allowedOriginPatterns:
              - "http://localhost:*"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS

            allowedHeaders:
              - "*"

            allowCredentials: true

      routes:

        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/users/**,/admin/users/**
          filters:
            - JwtValidation

        - id: role-service
          uri: http://localhost:8080
          predicates:
            - Path=/admin/roles/**
          filters:
            - JwtValidation

        - id: profile-service
          uri: http://localhost:8080
          predicates:
            - Path=/admin/profiles/**
          filters:
            - JwtValidation

        - id: employee-service
          uri: http://localhost:8081
          predicates:
            - Path=/admin/employees/**
          filters:
            - JwtValidation

        - id: branch-service
          uri: http://localhost:8081
          predicates:
            - Path=/admin/branches/**
          filters:
            - JwtValidation

        - id: employee-branch-mapping-service
          uri: http://localhost:8081
          predicates:
            - Path=/admin/employee-branch-mappings/**
          filters:
            - JwtValidation

eureka:
  client:
    enabled: false

auth:
  service:
    url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: "*"