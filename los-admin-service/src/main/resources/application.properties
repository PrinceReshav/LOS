spring.application.name=los-admin-service
server.port=8081
grpc.server.port=9091
# ========================
# H2 DATABASE
# ========================

spring.datasource.url=jdbc:h2:mem:los-admin-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JPA
# ========================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Run data.sql AFTER Hibernate creates the schema, so master data
# (departments, roles, languages, designations, hierarchy rules) is
# seeded automatically on every fresh start of this H2 in-memory DB.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ========================
# KAFKA
# ========================

spring.kafka.bootstrap-servers=localhost:9094

spring.kafka.consumer.group-id=los-admin-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.los.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.los.events.UserCreatedEvent

