spring.application.name=administration-service
server.port=8080
grpc.server.port=9090
grpc.client.employee-service.address=static://localhost:9091
grpc.client.employee-service.negotiationType=plaintext
bootstrap.admin-secret=${BOOTSTRAP_ADMIN_SECRET:LOCAL_DEV_SECRET}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/role/roleInsert.sql,classpath:db/profile/profileInsert.sql

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# ================= ALERT CONFIG =================

alerts.email.enabled=true
alerts.email.recipients=ops@company.com,tech@company.com

alerts.slack.enabled=false
alerts.slack.webhook-url=https://hooks.slack.com/services/XXXX


spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0