spring.application.name=administration-service
server.port=8080
grpc.server.port=9090
grpc.client.employee-service.address=static://localhost:9091
grpc.client.employee-service.negotiationType=plaintext

# Base URL of los-admin-service's REST API - used by OrgRoleClient to
# resolve/validate organizational roles (FIELD_OFFICER, CEO, ...) so the
# roleId sent to createEmployee via gRPC is guaranteed to exist in
# los-admin-service's own role catalog.
los-admin-service.base-url=${LOS_ADMIN_SERVICE_BASE_URL:http://localhost:8081}
bootstrap.admin-secret=${BOOTSTRAP_ADMIN_SECRET:LOCAL_DEV_SECRET}





#JWT SECRET KEY
jwt.secret=${JWT_SECRET:dev-secret-very-long-32-chars-minimum}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 TEST DATABASE

spring.datasource.url=jdbc:h2:file:./data/los-test-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/role/roleInsert.sql,classpath:db/profile/profileInsert.sql,classpath:db/permission/permissionInsert.sql,classpath:db/security/fieldPermissionInsert.sql,classpath:db/visibility/visibilityConfigInsert.sql,classpath:db/notification_template/notification_template.sql

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# ================= EMAIL CONFIG =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy}
spring.mail.password=${MAIL_PASSWORD:dummy}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



logging.level.org.springframework.mail=DEBUG
logging.level.jakarta.mail=DEBUG


# ================= ALERT CONFIG =================

alerts.email.enabled=true
alerts.email.recipients=ops@company.com,tech@company.com

alerts.slack.enabled=false
alerts.slack.webhook-url=https://hooks.slack.com/services/XXXX


spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

sms.api.url=https://dummy-url.com
sms.api.key=dummy-key